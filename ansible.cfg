[defaults]
inventory = inventories/lab.ini
host_key_checking = True
interpreter_python = auto
forks = 3
timeout = 20
retry_files_enabled = False

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=yes
pipelining = True

# Tasks that run on the controller itself, with delegate_to: localhost, also take
# their module through a pipe instead of a file under ~/.ansible/tmp; a task with
# async still writes one. Where fapolicyd watches the service, it denies such a file.
[connection]
pipelining = True
