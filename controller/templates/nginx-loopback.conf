# Optional alternative to forwarding directly to Semaphore on port 3000.
# Install only on a dedicated controller. Do not replace another site's config.
map $http_upgrade $semaphore_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 127.0.0.1:8080;
    server_name localhost;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $semaphore_connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }
}
