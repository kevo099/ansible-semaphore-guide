---
- name: Apply the vendor STIG remediation to one approved lab machine
  hosts: lab
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  vars_files:
    - vars/stig_systems.yml
  vars:
    stig_profile_el: xccdf_org.ssgproject.content_profile_stig
    stig_usg_profile: disa_stig
    stig_fetch_remote_resources: false
    # Set by the per-system playbooks under playbooks/stig/; empty means every
    # supported system, and the reports folder then has no system level.
    stig_os_scope: ''
    stig_report_folder: ''
    stig_content_file: ''
    stig_content_profile: ''
    allow_reboot: false
    # A Semaphore survey answer is a string; converting it here keeps the
    # approval check a real boolean. From the CLI pass -e '{"stig_confirm": true}'.
    stig_confirm: "{{ recovery_snapshot_ack | default('') == 'SNAPSHOT READY' }}"
    # stig_stamp is set once for every host of the run; see pre_tasks.
    stig_remote_dir: "/var/log/stig-practice/{{ stig_stamp }}"
    stig_fetch_dir: >-
      {{ lookup('env', 'HOME') }}/stig-reports/{{ stig_report_folder ~ '/' if stig_report_folder else '' }}{{ stig_stamp }}
  pre_tasks:
    # The recovery prompt names one exact target, so the run must select exactly one.
    # This check runs on the controller before any connection is made.
    - name: Change exactly one approved target per run
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
        fail_msg: >-
          STIG remediation changes one approved target at a time. This run selects
          {{ ansible_play_hosts_all | length }} hosts
          ({{ ansible_play_hosts_all | join(', ') }}). Limit it to a single host,
          for example --limit lab-alma, or enter that host in the Semaphore Limit prompt.
        quiet: true
      tags: always

    # Check mode skips the scanner and cannot predict the vendor's fixes, so
    # this is also refused on the controller before any connection.
    - name: Refuse check mode because vendor remediation cannot be predicted
      ansible.builtin.assert:
        that:
          - not ansible_check_mode
        fail_msg: >-
          Check mode skips the vendor scanner and cannot predict vendor
          remediation. For a read-only assessment, run stig-audit.yml without
          --check or Dry Run.
        quiet: true
      tags: always

    # A DISA SCAP benchmark carries checks but no fixes, so remediation always
    # uses the vendor's packaged content. Audit other content with stig-audit.yml.
    - name: Refuse a local content file, which remediation does not use
      ansible.builtin.assert:
        that:
          - stig_content_file | default('') | length == 0
        fail_msg: >-
          stig_content_file is for audits only. Remediation applies the vendor's
          packaged fixes; scan with your content file through stig-audit.yml.
        quiet: true
      tags: always

    - name: Check scope and supported operating system
      ansible.builtin.import_tasks: tasks/preflight.yml
      tags: always

    # The before and after reports share one folder, named once from the controller's
    # UTC clock. As in stig-audit.yml, this follows the preflight's fact gathering.
    - name: Use one report folder for the whole run # noqa: run-once[task]
      ansible.builtin.set_fact:
        stig_stamp: "{{ now(utc=true, fmt='%Y%m%dT%H%M%SZ') }}"
      run_once: true
      tags: always

    # The per-system playbooks under playbooks/stig/ set stig_os_scope, such as
    # RedHat-9 or Ubuntu-24.04, in the same form as this name.
    - name: Name this host's system the way the per-system playbooks do
      ansible.builtin.set_fact:
        stig_os_key: >-
          {{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_version']
          if ansible_facts['distribution'] == 'Ubuntu' else ansible_facts['distribution_major_version'] }}
      tags: always

    - name: Refuse a host that another system's playbook covers
      ansible.builtin.assert:
        that:
          - stig_os_scope | length == 0 or stig_os_key == stig_os_scope
        fail_msg: >-
          This run applies the STIG to {{ stig_systems[stig_os_scope].label }}
          hosts, and {{ inventory_hostname }} runs {{ stig_systems[stig_os_key].label }}.
          Use {{ stig_systems[stig_os_key].label }} · STIG apply, or
          playbooks/stig/{{ stig_systems[stig_os_key].folder }}/apply.yml, instead.
          Nothing was changed.
        quiet: true
      tags: always

    - name: Require a recorded recovery point and an explicit approval
      ansible.builtin.assert:
        that:
          - stig_confirm is boolean
          - stig_confirm
          - allow_reboot is boolean
        fail_msg: >-
          Refusing to change {{ inventory_hostname }}. Snapshot or back up this
          exact target first, then choose SNAPSHOT READY in the Semaphore prompt
          or pass -e '{"stig_confirm": true}' from the CLI. The key=value form
          produces a string and is rejected. Vendor STIG remediation changes
          SSH, sudo, kernel and login policy; keep console access ready.
        quiet: true
      tags: always
  tasks:
    - name: Record the posture before remediation
      ansible.builtin.import_tasks: tasks/stig_scan.yml
      vars:
        stig_phase: before

    # oscap applies the vendor's own fixes from the data stream; 2 means some
    # rules still fail after remediation, which is normal for a first pass.
    - name: Apply the vendor remediation on Enterprise Linux
      ansible.builtin.command:
        argv: >-
          {{ ['oscap', 'xccdf', 'eval', '--remediate']
             + (['--fetch-remote-resources'] if stig_fetch_remote_resources else [])
             + ['--profile', stig_profile_el,
                '--results', stig_remote_dir ~ '/remediate.xml',
                '--report', stig_remote_dir ~ '/remediate.html',
                stig_datastream] }}
      register: stig_remediate_el
      changed_when: true
      failed_when: stig_remediate_el.rc not in [0, 2]
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Apply the vendor remediation on Ubuntu
      ansible.builtin.command:
        argv:
          - usg
          - fix
          - "{{ stig_usg_profile }}"
      register: stig_remediate_usg
      changed_when: true
      when: ansible_facts['os_family'] == 'Debian'

    - name: Reboot only when explicitly approved
      ansible.builtin.reboot:
        reboot_timeout: 900
        connect_timeout: 10
        post_reboot_delay: 15
      when: allow_reboot

    - name: Record the posture after remediation
      ansible.builtin.import_tasks: tasks/stig_scan.yml
      vars:
        stig_phase: after

    - name: Explain what to verify next
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: vendor remediation applied
          {{ 'and rebooted' if allow_reboot else 'without a reboot; many STIG rules only take effect after one' }}.
          Check console login, SSH and sudo now: STIG commonly removes NOPASSWD
          sudo rules, such as the one cloud-init gives an image's administrator,
          so confirm each account you administer with can still sudo with a
          password you know. Compare the before and after reports.
