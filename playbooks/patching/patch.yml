---
- name: Patch one lab machine at a time
  hosts: lab
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  vars:
    allow_reboot: false
  pre_tasks:
    - name: Check scope and supported operating system
      ansible.builtin.import_tasks: ../tasks/preflight.yml
      tags: always

    - name: Require a real boolean for reboot approval
      ansible.builtin.assert:
        that:
          - allow_reboot is boolean
        fail_msg: >-
          Pass JSON or YAML booleans, for example -e '{"allow_reboot":true}'.
          The key=value form produces strings and is rejected.
        quiet: true
  tasks:
    # The boot ID is new at every start and differs between any two machines. The
    # lookup reads it where Ansible runs, so the same value means this host is the
    # controller the run comes from. Its reboot would stop the run in the middle and
    # leave the hosts after it unpatched, so it is left for its own terminal.
    - name: Read the boot ID
      ansible.builtin.slurp:
        src: /proc/sys/kernel/random/boot_id
      register: lab_boot_id

    - name: Recognize the controller this run comes from
      ansible.builtin.set_fact:
        lab_is_controller: >-
          {{ (lab_boot_id.content | b64decode | trim) ==
             (lookup('ansible.builtin.file', '/proc/sys/kernel/random/boot_id') | trim) }}

    # After a library update, Ubuntu's needrestart restarts the services that use it,
    # Semaphore among them, which would end this run halfway on the controller it comes
    # from. There the restarts are left for the administrator, and the report says so.
    - name: Upgrade Ubuntu packages without removals
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        upgrade: dist
        fail_on_autoremove: true
        autoremove: false
        lock_timeout: 600
        auto_install_module_deps: false
      environment: "{{ {'NEEDRESTART_SUSPEND': '1'} if lab_is_controller else {} }}"
      when: ansible_facts['os_family'] == 'Debian'

    - name: Install the EL reboot-check plugin
      ansible.builtin.dnf:
        name: dnf-plugins-core
        state: present
        lock_timeout: 600
      when: ansible_facts['os_family'] == 'RedHat'

    # Updating to repository versions is the explicit purpose of this lesson.
    - name: Upgrade Enterprise Linux packages # noqa: package-latest
      ansible.builtin.dnf:
        name: '*'
        state: latest
        update_cache: true
        lock_timeout: 600
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Explain what check mode cannot predict
      ansible.builtin.debug:
        msg: >-
          CHECK MODE: package changes above are predictions using available
          repository metadata. No updates or reboot were applied. The reboot
          decision is unknown until updates have actually run; it was skipped.
      when: ansible_check_mode

    - name: Detect and optionally handle a reboot after real patching
      when: not ansible_check_mode
      block:
        - name: Read the Ubuntu reboot marker
          ansible.builtin.stat:
            path: /var/run/reboot-required
          register: lab_reboot_marker
          when: ansible_facts['os_family'] == 'Debian'

        - name: Ask DNF whether a reboot is required
          ansible.builtin.command:
            argv: [dnf, needs-restarting, -r]
          register: lab_reboot_hint
          changed_when: false
          failed_when: lab_reboot_hint.rc not in [0, 1]
          when: ansible_facts['os_family'] == 'RedHat'

        - name: Record the operating system's reboot advice
          ansible.builtin.set_fact:
            lab_reboot_needed: >-
              {{ (lab_reboot_marker.stat.exists | default(false)) or
                 ((lab_reboot_hint.rc | default(0)) == 1) }}

        - name: Reboot only when required and explicitly approved
          ansible.builtin.reboot:
            reboot_timeout: 900
            connect_timeout: 10
            post_reboot_delay: 10
          when: lab_reboot_needed and allow_reboot and not lab_is_controller

        - name: Report the completed patch result
          vars:
            lab_controller_note: >-
              required and left alone: {{ inventory_hostname }} is the controller this run
              comes from, and its reboot would stop the run. Restart it from its own terminal
              when no task is running, with sudo systemctl reboot
            lab_services_note: >-
              Services were not restarted on this controller, so that the run could finish:
              run sudo needrestart from its own terminal when no task is running, or reboot it.
            lab_services_suffix: >-
              {{ (' ' ~ lab_services_note) if (lab_is_controller and ansible_facts['os_family'] == 'Debian') else '' }}
          ansible.builtin.debug:
            msg: >-
              {{ inventory_hostname }}: updates completed. Reboot
              {{ lab_controller_note if (lab_reboot_needed and allow_reboot and lab_is_controller)
                 else ('completed and connection restored' if (lab_reboot_needed and allow_reboot)
                 else ('required; left for the operator' if lab_reboot_needed
                 else 'not requested by the operating system')) }}.{{ lab_services_suffix }}
