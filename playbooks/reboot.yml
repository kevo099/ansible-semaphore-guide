---
# Reboots exactly one host per run, after an explicit acknowledgement, and
# shows its boot before and after. Check mode reads the host and reboots nothing.
- name: Reboot one approved lab machine
  hosts: lab
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  vars:
    # A Semaphore survey answer is a string; converting it here keeps the
    # acknowledgement a real boolean. From the CLI pass -e '{"reboot_confirm": true}'.
    reboot_confirm: "{{ reboot_target_ack | default('') == 'REBOOT NOW' }}"
    # Worked out from what the tasks below read, when the messages use them.
    reboot_id_before: "{{ reboot_boot_id_before.content | b64decode | trim }}"
    reboot_up_before: "{{ (reboot_uptime_before.content | b64decode).split()[0] | float | int }}"
    reboot_up_before_text: >-
      {{ '%d d %d h %d min' | format(reboot_up_before | int // 86400, reboot_up_before | int % 86400 // 3600,
         reboot_up_before | int % 3600 // 60) }}
    reboot_id_after: "{{ reboot_boot_id_after.content | b64decode | trim }}"
    reboot_up_after: "{{ (reboot_uptime_after.content | b64decode).split()[0] | float | int }}"
    reboot_units_before: >-
      {{ reboot_failed_before.stdout_lines | default([]) | map('regex_replace', '^[●\s]*(\S+).*$', '\1')
         | select | list }}
    reboot_units_after: >-
      {{ reboot_failed_after.stdout_lines | default([]) | map('regex_replace', '^[●\s]*(\S+).*$', '\1')
         | select | list }}
    reboot_units_after_text: >-
      {{ 'unknown, systemctl could not list them' if reboot_failed_after.rc | default(1) != 0
         else (reboot_units_after | length) ~ ((': ' ~ reboot_units_after[:5] | join(', ')
         ~ (', ...' if reboot_units_after | length > 5 else '')) if reboot_units_after else '') }}
  pre_tasks:
    # The acknowledgement names one exact target, so the run must select exactly one.
    # This check runs on the controller before any connection is made.
    - name: Reboot exactly one target per run
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
        fail_msg: >-
          This playbook reboots one target at a time. This run selects
          {{ ansible_play_hosts_all | length }} hosts
          ({{ ansible_play_hosts_all | join(', ') }}). Limit it to a single host,
          for example --limit lab-alma, or enter that host in the Semaphore Limit prompt.
          Nothing was changed.
        quiet: true
      tags: always

    # Check mode reboots nothing, so it shows its preview without the acknowledgement.
    - name: Require an explicit acknowledgement
      ansible.builtin.assert:
        that:
          - reboot_confirm is boolean
          - reboot_confirm or ansible_check_mode
        fail_msg: >-
          Refusing to reboot {{ ansible_play_hosts_all | join(', ') }}. Its services stop
          and anyone using it is disconnected for a few minutes. Choose REBOOT NOW in the
          Semaphore prompt, or pass -e '{"reboot_confirm": true}' from the CLI; the key=value
          form produces a string and is rejected. Nothing was changed.
        quiet: true
      tags: always

    - name: Check scope and supported operating system
      ansible.builtin.import_tasks: tasks/preflight.yml
      tags: always
  tasks:
    - name: Read the boot ID before the reboot
      ansible.builtin.slurp:
        src: /proc/sys/kernel/random/boot_id
      register: reboot_boot_id_before

    # The boot ID is new at every start and differs between any two machines. The
    # lookup reads it where Ansible runs, so the same value means the target is this
    # controller, and its reboot would end the run in the middle.
    - name: Refuse to reboot the controller this run comes from
      ansible.builtin.assert:
        that:
          - reboot_id_before != lookup('ansible.builtin.file', '/proc/sys/kernel/random/boot_id') | trim
        fail_msg: >-
          {{ inventory_hostname }} is the controller this run comes from: its reboot would
          stop Semaphore in the middle of the task. Restart the controller from its own
          terminal, with sudo systemctl reboot, when no task is running. Nothing was changed.
        quiet: true

    - name: Read the uptime before the reboot
      ansible.builtin.slurp:
        src: /proc/uptime
      register: reboot_uptime_before

    # No module lists failed units.
    - name: List the failed systemd units before the reboot # noqa: command-instead-of-module
      ansible.builtin.command:
        argv: [systemctl, list-units, --state=failed, --plain, --no-legend, --no-pager]
      register: reboot_failed_before
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Say what a real run would do
      ansible.builtin.debug:
        msg: >-
          CHECK MODE: a real run reboots {{ inventory_hostname }} now and waits up to
          15 minutes for it to answer again. Boot ID
          {{ reboot_id_before }}, up {{ reboot_up_before_text }}, {{ reboot_units_before | length }}
          failed systemd unit(s).
          {{ 'The acknowledgement was given.' if reboot_confirm else 'A real run also needs the acknowledgement, REBOOT NOW.' }}
          Nothing was changed.
      when: ansible_check_mode

    - name: Reboot and wait for the target to answer again
      ansible.builtin.reboot:
        msg: Reboot requested from Ansible by the Reboot one target lesson
        reboot_timeout: 900
        connect_timeout: 10
        post_reboot_delay: 10
      when: not ansible_check_mode

    - name: Read the target after the reboot
      when: not ansible_check_mode
      block:
        # degraded means the boot finished with failed units; timeout exits 124 after 5 minutes.
        - name: Wait for the boot to finish
          ansible.builtin.command:
            argv: [timeout, '300', systemctl, is-system-running, --wait]
          register: reboot_system_state
          changed_when: false
          failed_when: false

        - name: Read the boot ID after the reboot
          ansible.builtin.slurp:
            src: /proc/sys/kernel/random/boot_id
          register: reboot_boot_id_after

        - name: Read the uptime after the reboot
          ansible.builtin.slurp:
            src: /proc/uptime
          register: reboot_uptime_after

        - name: List the failed systemd units after the reboot # noqa: command-instead-of-module
          ansible.builtin.command:
            argv: [systemctl, list-units, --state=failed, --plain, --no-legend, --no-pager]
          register: reboot_failed_after
          changed_when: false
          failed_when: false

        - name: Report the boot before and after
          ansible.builtin.debug:
            msg:
              - "{{ inventory_hostname }} rebooted and answers again."
              - >-
                Boot ID: {{ reboot_id_before }} before, {{ reboot_id_after }} now
                ({{ 'changed' if reboot_id_after != reboot_id_before else 'UNCHANGED: check the console' }}).
              - "Uptime: {{ reboot_up_before_text }} before, {{ reboot_up_after }} s now."
              - >-
                System state: {{ reboot_system_state.stdout | default('') | trim
                or 'still starting after 5 minutes, or unknown' }}.
              - >-
                Failed systemd units now: {{ reboot_units_after_text }} (before the reboot:
                {{ reboot_units_before | length if reboot_failed_before.rc == 0 else 'unknown' }}).
