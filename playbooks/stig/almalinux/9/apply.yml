---
# Vendor STIG remediation of one approved AlmaLinux 9 host; the seeded
# "AlmaLinux 9 · STIG apply" templates run it. A host that runs another system is
# refused before anything changes.
- name: Apply the vendor STIG to one approved AlmaLinux 9 host
  ansible.builtin.import_playbook: ../../../stig-apply.yml
  vars:
    stig_os_scope: AlmaLinux-9
    stig_report_folder: almalinux/9
