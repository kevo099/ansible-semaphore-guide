---
# Vendor STIG audit of the AlmaLinux 9 hosts in the run's limit; the seeded
# "AlmaLinux 9 · STIG audit" templates run it. Hosts that run another system are
# skipped, and reports go to ~/stig-reports/almalinux/9/ on the controller.
- name: Audit AlmaLinux 9 hosts against the vendor STIG
  ansible.builtin.import_playbook: ../../../stig-audit.yml
  vars:
    stig_os_scope: AlmaLinux-9
    stig_report_folder: almalinux/9
