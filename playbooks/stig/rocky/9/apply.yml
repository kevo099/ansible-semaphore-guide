---
# Vendor STIG remediation of one approved Rocky Linux 9 host; the seeded
# "Rocky Linux 9 · STIG apply" templates run it. A host that runs another system is
# refused before anything changes.
- name: Apply the vendor STIG to one approved Rocky Linux 9 host
  ansible.builtin.import_playbook: ../../../stig-apply.yml
  vars:
    stig_os_scope: Rocky-9
    stig_report_folder: rocky/9
