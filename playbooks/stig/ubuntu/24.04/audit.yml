---
# Vendor STIG audit of the Ubuntu 24.04 hosts in the run's limit; the seeded
# "Ubuntu 24.04 · STIG audit" templates run it. Hosts that run another system are
# skipped, and reports go to ~/stig-reports/ubuntu/24.04/ on the controller.
- name: Audit Ubuntu 24.04 hosts against the vendor STIG
  ansible.builtin.import_playbook: ../../../stig-audit.yml
  vars:
    stig_os_scope: Ubuntu-24.04
    stig_report_folder: ubuntu/24.04
