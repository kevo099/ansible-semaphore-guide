---
- name: Prove SSH, Python, and target identity
  hosts: lab
  gather_facts: false
  any_errors_fatal: true
  pre_tasks:
    - name: Check scope and supported operating system
      ansible.builtin.import_tasks: tasks/preflight.yml
      tags: always
  tasks:
    - name: Test the Ansible connection
      ansible.builtin.ping:

    - name: Explain what answered
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} ({{ ansible_host | default(inventory_hostname) }})
          runs {{ ansible_facts['distribution'] }}
          {{ ansible_facts['distribution_version'] }}.
          Ansible ping proves SSH and Python, not ICMP or sudo.
