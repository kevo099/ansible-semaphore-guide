---
# Shared by stig-audit.yml and stig-apply.yml. By default it uses only the
# operating-system vendor's scanner and STIG content; the guide adds no rules of
# its own. With stig_content_file, stig-audit.yml scans with a SCAP data stream
# you supply instead, such as a DISA SCAP benchmark, using OpenSCAP on either family.
# Expects: stig_phase, stig_profile_el, stig_usg_profile,
# stig_fetch_remote_resources, stig_remote_dir, stig_fetch_dir,
# stig_content_file, stig_content_profile.
- name: Note whether this scan uses a local SCAP content file
  ansible.builtin.set_fact:
    stig_local_content: "{{ stig_content_file | default('') | length > 0 }}"
    # A relative path is inside the lab folder, next to playbooks/.
    stig_content_source: >-
      {{ stig_content_file if stig_content_file | default('') is abs
         else playbook_dir ~ '/../' ~ stig_content_file | default('') }}

- name: Check the local content file and its profile on the controller
  when: stig_local_content
  block:
    - name: Look for the local content file on the controller
      ansible.builtin.stat:
        path: "{{ stig_content_source }}"
      register: stig_content_stat
      delegate_to: localhost
      become: false

    - name: Refuse a missing file, a placeholder or an incomplete profile ID
      ansible.builtin.assert:
        that:
          - "'REPLACE_WITH' not in stig_content_file ~ stig_content_profile | default('')"
          - stig_content_stat.stat.exists
          - stig_content_stat.stat.isreg | default(false)
          - stig_content_file is match('.*[.]xml$')
          - stig_content_profile | default('') is match('^xccdf_[A-Za-z0-9_.-]+_profile_[A-Za-z0-9_.-]+$')
        fail_msg: >-
          Set stig_content_file to an XML SCAP data stream in the lab folder, for
          example content/U_RHEL_9_V2R9_STIG_SCAP_1-3_Benchmark.xml, and
          stig_content_profile to a full profile ID that file lists (oscap info FILE),
          for example xccdf_mil.disa.stig_profile_MAC-1_Classified.
        quiet: true

- name: Install the vendor SCAP scanner and content on Enterprise Linux
  ansible.builtin.dnf:
    name: "{{ ['openscap-scanner'] + ([] if stig_local_content else ['scap-security-guide']) }}"
    state: present
    lock_timeout: 120
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install the OpenSCAP scanner on Ubuntu for local content
  ansible.builtin.apt:
    name: openscap-scanner
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 120
  when:
    - ansible_facts['os_family'] == 'Debian'
    - stig_local_content

- name: Look for the Ubuntu Security Guide command
  ansible.builtin.command:
    argv: [which, usg]
  register: stig_usg_present
  changed_when: false
  failed_when: false
  when:
    - ansible_facts['os_family'] == 'Debian'
    - not stig_local_content

- name: Explain the Ubuntu prerequisite instead of attaching a subscription
  ansible.builtin.assert:
    that:
      - stig_usg_present.rc == 0
    fail_msg: >-
      usg is not installed on {{ inventory_hostname }}. Attach Ubuntu Pro with
      your own account, then run: sudo pro enable usg && sudo apt-get install -y usg.
      This lesson never handles subscription tokens.
    quiet: true
  when:
    - ansible_facts['os_family'] == 'Debian'
    - not stig_local_content

# Each distribution packages its own data stream; never point one at another's content.
- name: Choose the vendor STIG data stream for this Enterprise Linux release
  ansible.builtin.set_fact:
    stig_datastream: >-
      /usr/share/xml/scap/ssg/content/ssg-{{ {'RedHat': 'rhel9', 'AlmaLinux': 'almalinux9',
      'Rocky': 'rl9'}[ansible_facts['distribution']] }}-ds.xml
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - not stig_local_content

- name: Create the evidence directory on the target
  ansible.builtin.file:
    path: "{{ stig_remote_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Copy the local content file to the target
  ansible.builtin.copy:
    src: "{{ stig_content_source }}"
    dest: "{{ stig_remote_dir }}/content.xml"
    owner: root
    group: root
    mode: '0600'
  when: stig_local_content

# The content's own platform checks decide applicability: a benchmark written
# for another system reports its rules as notapplicable instead of failing them.
- name: Scan against the profile in the local content file
  ansible.builtin.command:
    argv:
      - oscap
      - xccdf
      - eval
      - --profile
      - "{{ stig_content_profile }}"
      - --results
      - "{{ stig_remote_dir }}/{{ stig_phase }}.xml"
      - --report
      - "{{ stig_remote_dir }}/{{ stig_phase }}.html"
      - "{{ stig_remote_dir }}/content.xml"
  register: stig_scan_local
  changed_when: false
  failed_when: stig_scan_local.rc not in [0, 2]
  when: stig_local_content

# oscap returns 2 when at least one rule failed; only 1 is a scanner error.
- name: Scan Enterprise Linux against the vendor STIG profile
  ansible.builtin.command:
    argv: >-
      {{ ['oscap', 'xccdf', 'eval']
         + (['--fetch-remote-resources'] if stig_fetch_remote_resources else [])
         + ['--profile', stig_profile_el,
            '--results', stig_remote_dir ~ '/' ~ stig_phase ~ '.xml',
            '--report', stig_remote_dir ~ '/' ~ stig_phase ~ '.html',
            stig_datastream] }}
  register: stig_scan_el
  changed_when: false
  failed_when: stig_scan_el.rc not in [0, 2]
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - not stig_local_content

- name: Scan Ubuntu with the Ubuntu Security Guide STIG profile
  ansible.builtin.command:
    argv:
      - usg
      - audit
      - "{{ stig_usg_profile }}"
      - --results-file
      - "{{ stig_remote_dir }}/{{ stig_phase }}.xml"
      - --html-file
      - "{{ stig_remote_dir }}/{{ stig_phase }}.html"
  register: stig_scan_usg
  changed_when: false
  failed_when: false
  when:
    - ansible_facts['os_family'] == 'Debian'
    - not stig_local_content

- name: Confirm the scanner wrote its XCCDF results
  ansible.builtin.stat:
    path: "{{ stig_remote_dir }}/{{ stig_phase }}.xml"
  register: stig_results_file

- name: Stop when no results were produced
  ansible.builtin.assert:
    that:
      - stig_results_file.stat.exists
      - stig_results_file.stat.size > 0
    fail_msg: >-
      The vendor scanner produced no results on {{ inventory_hostname }}.
      Inspect the task output above for the scanner's own error.
    quiet: true

- name: Fetch the results and report to the controller for phase {{ stig_phase }}
  ansible.builtin.fetch:
    src: "{{ stig_remote_dir }}/{{ stig_phase }}.{{ item }}"
    dest: "{{ stig_fetch_dir }}/{{ inventory_hostname }}/{{ stig_phase }}.{{ item }}"
    flat: true
  loop:
    - xml
    - html

- name: Summarize the fetched XCCDF result on the controller
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - "{{ playbook_dir }}/../scripts/summarize_xccdf.py"
      - "{{ stig_fetch_dir }}/{{ inventory_hostname }}/{{ stig_phase }}.xml"
  register: stig_summary
  changed_when: false
  failed_when: false
  delegate_to: localhost
  become: false

# The summarizer prints its JSON and exits 0, or exits 2 after printing it when
# error or unknown outcomes exist. Python also exits 2 with no output when the
# script is missing, so the output must start like JSON before it is parsed.
- name: Report the scan outcome counts for phase {{ stig_phase }}
  ansible.builtin.debug:
    msg: >-
      {{ (stig_summary.stdout | from_json)
         if (stig_summary.rc in [0, 2] and stig_summary.stdout.startswith('{'))
         else 'Summary unavailable; read the HTML report. '
              ~ (stig_summary.stderr or stig_summary.msg | default('')) }}

- name: Warn about scanner errors or unknown outcomes for phase {{ stig_phase }}
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: the {{ stig_phase }} results contain error or
      unknown outcomes, so this scan is incomplete. Read those rules in the
      HTML report before comparing counts.
  when:
    - stig_summary.rc in [0, 2]
    - stig_summary.stdout.startswith('{')
    - (stig_summary.stdout | from_json)['has_scanner_errors_or_unknowns']

- name: Say where the evidence is for phase {{ stig_phase }}
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: {{ stig_phase }} report kept on the target under
      {{ stig_remote_dir }} and fetched to {{ stig_fetch_dir }}/{{ inventory_hostname }}.
      A completed scan is evidence, not compliance; failed, manual and
      not-applicable rules still need a reader.
