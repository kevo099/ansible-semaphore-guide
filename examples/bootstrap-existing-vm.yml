---
# One-shot preparation of a VM that already exists (made in a cloud portal, by
# another tool, or before cloud-init was set up): the automated form of chapter
# 4, steps 3 and 4. It creates or completes svc_ansible, authorizes the listed
# public keys, ensures the target prerequisites, sets the sudo password you type,
# and adds the dedicated sudoers and SSH drop-ins. It is safe to run again, and
# ends with the add-target.sh command that adds the host on the controller. Unlike
# the scripts that run on a VM, it builds that command on the controller itself.
#
# The VM must already accept SSH from the controller for an administrator whose
# sudo works, and have Python 3; mainstream cloud images do.
#
# Run it from the controller's repository root, as the VM's own administrator
# account, one host at a time (each target gets its own sudo password):
#
#   /opt/ansible-venv/bin/ansible-playbook -i inventories/bootstrap.ini \
#     examples/bootstrap-existing-vm.yml --limit new-vm -u YOUR_ADMIN [-K]
#
# -K is needed only when that administrator's own sudo asks for a password.
- name: Prepare an existing VM for the automation account
  hosts: all
  gather_facts: true
  become: true
  vars_prompt:
    - name: svc_ansible_password
      prompt: New sudo password for svc_ansible on this host (unique per target)
      private: true
      confirm: true
  vars:
    # Every public key that may log in as svc_ansible. On a controller made by either
    # installer, list the exported service key and, if you use one, your CLI key.
    automation_public_key_files:
      - ~/.ssh/ansible_lab.pub
    automation_public_keys: "{{ query('ansible.builtin.file', *automation_public_key_files) }}"
    ssh_service: "{{ 'ssh' if ansible_facts['os_family'] == 'Debian' else 'sshd' }}"
    ssh_dropin: /etc/ssh/sshd_config.d/70-ansible-lab.conf
    # The account's real home and UID, which sshd uses, once getent has read them.
    bootstrap_home: "{{ ansible_facts['getent_passwd']['svc_ansible'][4] }}"
    bootstrap_uid: "{{ ansible_facts['getent_passwd']['svc_ansible'][1] }}"
    # SSH_CONNECTION holds the client address and port, then this host's address and port,
    # so the policy is read for exactly the connection the controller uses.
    bootstrap_sshd_context: >-
      {% set c = bootstrap_ssh_connection.stdout.split() %}user=svc_ansible,host={{ c[0] }},addr={{ c[0] }},laddr={{ c[2] }},lport={{ c[3] }}
  pre_tasks:
    - name: Require a limit that selects exactly one host
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_play_hosts_all | length == 1
        fail_msg: Name one host with --limit; each target gets its own sudo password.
        quiet: true

    - name: Accept only the systems the lessons support
      ansible.builtin.assert:
        that:
          - >-
            (ansible_facts['distribution'] == 'Ubuntu' and ansible_facts['distribution_major_version'] == '24')
            or (ansible_facts['distribution'] in ['AlmaLinux', 'Rocky', 'RedHat']
                and ansible_facts['distribution_major_version'] == '9')
        fail_msg: This playbook prepares Ubuntu 24.04 or AlmaLinux, Rocky Linux or RHEL 9 only.
        quiet: true

    - name: Accept only public keys and a password of reasonable length
      ansible.builtin.assert:
        that:
          - automation_public_keys | length > 0
          - automation_public_keys | reject('match', '^(ssh-rsa|ssh-ed25519|ecdsa-sha2-nistp[0-9]+) [A-Za-z0-9+/=]+( .*)?$') | list | length == 0
          - svc_ansible_password | length >= 12
        fail_msg: List only single-line public key files, and use a sudo password of at least 12 characters.
        quiet: true
      no_log: true

    - name: Find the address this host sees for the controller
      ansible.builtin.command: printenv SSH_CONNECTION
      become: false
      register: bootstrap_ssh_connection
      changed_when: false

    - name: Read which keys this SSH server accepts for svc_ansible
      ansible.builtin.command: /usr/sbin/sshd -T -C {{ bootstrap_sshd_context }}
      register: bootstrap_sshd_before
      changed_when: false

    - name: Measure each listed key on the controller
      ansible.builtin.command: ssh-keygen -lf -
      args:
        stdin: "{{ item }}"
      loop: "{{ automation_public_keys }}"
      loop_control:
        label: "{{ item.split()[0] }}"
      register: bootstrap_key_sizes
      changed_when: false
      delegate_to: localhost
      become: false

    # A FIPS or STIG crypto policy refuses Ed25519 keys, and servers set a minimum RSA
    # size; replacing the list with keys the server rejects would lock svc_ansible out.
    - name: Require at least one listed key that can log in
      ansible.builtin.assert:
        that:
          - bootstrap_usable_other | length + (bootstrap_usable_rsa | length if bootstrap_rsa_accepted else 0) > 0
        fail_msg: >-
          None of the listed keys can log in: this server accepts
          {{ bootstrap_accepted | join(', ') }}, and RSA keys of at least
          {{ bootstrap_min_rsa }} bits. Use an RSA 4096 key.
        quiet: true
      vars:
        bootstrap_policy_before: "{{ bootstrap_sshd_before.stdout_lines }}"
        bootstrap_accepted: >-
          {{ (bootstrap_policy_before | select('match', '^pubkeyacceptedalgorithms ')
              | first | default('pubkeyacceptedalgorithms none')).split()[1].split(',') }}
        # OpenSSH 9.1 and later report RequiredRSASize; the guide never accepts less than 2048 bits.
        bootstrap_min_rsa: >-
          {{ ([2048] + (bootstrap_policy_before | select('match', '^requiredrsasize ')
              | map('split') | map('last') | map('int') | list)) | max }}
        # The controller's SSH client signs with SHA-2 only, never with SHA-1 ssh-rsa.
        bootstrap_rsa_accepted: "{{ ['rsa-sha2-512', 'rsa-sha2-256'] | intersect(bootstrap_accepted) | length > 0 }}"
        bootstrap_usable_rsa: >-
          {{ bootstrap_key_sizes.results | selectattr('item', 'match', '^ssh-rsa ')
             | map(attribute='stdout') | map('split') | map('first') | map('int')
             | select('ge', bootstrap_min_rsa | int) | list }}
        bootstrap_usable_other: >-
          {{ automation_public_keys | map('split') | map('first') | reject('eq', 'ssh-rsa')
             | select('in', bootstrap_accepted) | list }}

  tasks:
    - name: Ensure the Ubuntu prerequisites
      ansible.builtin.apt:
        name: [python3, python3-apt, sudo, openssh-server]
        state: present
        update_cache: true
        cache_valid_time: 3600
        lock_timeout: 600
      when: ansible_facts['os_family'] == 'Debian'

    - name: Ensure the Enterprise Linux prerequisites
      ansible.builtin.dnf:
        name: [python3, python3-dnf, python3-libselinux, sudo, openssh-server]
        state: present
        lock_timeout: 600
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Create or complete the automation account
      ansible.builtin.user:
        name: svc_ansible
        shell: /bin/bash
        create_home: true
        # A per-host salt keeps the hash stable, so a repeat run reports no change.
        password: "{{ svc_ansible_password | password_hash('sha512', inventory_hostname | hash('sha256') | truncate(16, True, '')) }}"
        update_password: always
      no_log: true

    - name: Read the account's home directory
      ansible.builtin.getent:
        database: passwd
        key: svc_ansible

    - name: Look at the account's SSH directory and key file without following links
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        get_checksum: false
      loop:
        - "{{ bootstrap_home }}/.ssh"
        - "{{ bootstrap_home }}/.ssh/authorized_keys"
      register: bootstrap_ssh_paths

    # Root would follow a link that whoever controls the account planted there.
    - name: Refuse a link in place of the SSH directory or key file
      ansible.builtin.assert:
        that:
          - bootstrap_home is regex('/[A-Za-z0-9._/-]+', match_type='fullmatch')
          - bootstrap_ssh_paths.results | map(attribute='stat') | selectattr('islnk', 'defined') | selectattr('islnk') | list | length == 0
        fail_msg: >-
          {{ bootstrap_home }}/.ssh or its authorized_keys is a link, or the home is not a
          plain absolute path. Resolve that by hand before running this again.
        quiet: true

    # Written as svc_ansible, like onboard-linux.sh does, so no link can redirect root.
    - name: Authorize exactly the listed public keys
      ansible.builtin.command:
        argv:
          - /bin/bash
          - -c
          - |
            set -euo pipefail
            umask 077
            mkdir -p "$1/.ssh"
            chmod 0700 "$1/.ssh"
            [ ! -d "$1/.ssh/authorized_keys" ] || { echo "authorized_keys is a directory" >&2; exit 1; }
            staged=$(mktemp "$1/.ssh/.authorized_keys.XXXXXX")
            cat > "$staged"
            if cmp -s "$staged" "$1/.ssh/authorized_keys"; then
              rm -f "$staged"
              echo unchanged
            else
              mv -f "$staged" "$1/.ssh/authorized_keys"
              echo replaced
            fi
            chmod 0600 "$1/.ssh/authorized_keys"
          - bootstrap-keys
          - "{{ bootstrap_home }}"
        stdin: "{{ automation_public_keys | join('\n') }}"
      become: true
      become_user: svc_ansible
      vars:
        ansible_pipelining: true
      register: bootstrap_keys
      changed_when: bootstrap_keys.stdout == 'replaced'

    - name: Restore SELinux labels on the SSH directory
      ansible.builtin.command:
        argv: [restorecon, -RFv, "{{ bootstrap_home }}/.ssh"]
      register: bootstrap_restorecon
      changed_when: bootstrap_restorecon.stdout | length > 0
      when: ansible_facts['selinux']['status'] | default('disabled') == 'enabled'

    - name: Allow svc_ansible to use sudo with its password
      ansible.builtin.copy:
        content: |
          Defaults:svc_ansible !requiretty
          svc_ansible ALL=(ALL:ALL) ALL
        dest: /etc/sudoers.d/90-ansible-lab
        owner: root
        group: root
        mode: "0440"
        validate: visudo -cf %s

    - name: Record whether the SSH drop-in already exists
      ansible.builtin.stat:
        path: "{{ ssh_dropin }}"
      register: bootstrap_dropin_before

    - name: Require a key for svc_ansible over SSH, checked before any reload
      block:
        - name: Write the account's SSH drop-in
          ansible.builtin.copy:
            content: |
              Match User svc_ansible
                  AuthenticationMethods publickey
                  PasswordAuthentication no
                  KbdInteractiveAuthentication no
              Match all
            dest: "{{ ssh_dropin }}"
            owner: root
            group: root
            mode: "0644"
            backup: true
          register: bootstrap_dropin

        - name: Check the complete SSH configuration
          ansible.builtin.command: /usr/sbin/sshd -t
          changed_when: false

        - name: Read the effective SSH policy for svc_ansible from this controller
          ansible.builtin.command: /usr/sbin/sshd -T -C {{ bootstrap_sshd_context }}
          register: bootstrap_sshd_policy
          changed_when: false

        - name: Check that the policy is the one chapter 4 expects
          ansible.builtin.assert:
            that:
              - "'authenticationmethods publickey' in bootstrap_sshd_policy.stdout_lines"
              - "'passwordauthentication no' in bootstrap_sshd_policy.stdout_lines"
              - "'kbdinteractiveauthentication no' in bootstrap_sshd_policy.stdout_lines"
              - "'pubkeyauthentication yes' in bootstrap_sshd_policy.stdout_lines"
              - (bootstrap_home ~ '/.ssh/authorized_keys') in bootstrap_key_paths
            fail_msg: Another SSH setting overrides the svc_ansible policy; resolve it before reloading SSH.
            quiet: true
          vars:
            # AuthorizedKeysFile entries with their tokens resolved; relative ones are in the
            # home. A lookahead adds the home: in this expression ansible-core 2.21 passes a
            # backreference to regex_replace as literal text, which broke every relative path.
            # The home is a plain path, checked above, so it is safe as a replacement.
            bootstrap_key_paths: >-
              {{ (bootstrap_sshd_policy.stdout_lines | select('match', '^authorizedkeysfile ')
                  | first | default('authorizedkeysfile none')).split()[1:]
                 | map('replace', '%h', bootstrap_home) | map('replace', '%u', 'svc_ansible')
                 | map('replace', '%U', bootstrap_uid | string)
                 | map('regex_replace', '^(?=[^/])', bootstrap_home ~ '/') | list }}

        - name: Read the groups sshd compares with AllowGroups and DenyGroups
          ansible.builtin.command: id -nG svc_ansible
          register: bootstrap_account_groups
          changed_when: false

        # The same verdicts as sshd_access in onboard-linux.sh: sshd compares an entry
        # without * or ? exactly, and so does this. Entries this cannot judge are only
        # reported: a pattern, svc_ansible@host, two @ (OpenSSH 9.8 and earlier split
        # at the first, later versions at the last), and a group name with a space,
        # which id -nG cannot show.
        - name: Check that DenyUsers, AllowUsers, DenyGroups and AllowGroups let svc_ansible in
          ansible.builtin.assert:
            that:
              - bootstrap_access_refused | length == 0
            fail_msg: >-
              {{ bootstrap_access_refused | join('; ') }}; sshd would refuse the account,
              so allow svc_ansible there before running this again.
            success_msg: >-
              {{ ('This check cannot evaluate "' ~ bootstrap_access_unsure | join('", "')
                  ~ '"; make sure sshd lets svc_ansible in.') if bootstrap_access_unsure
                 else 'Nothing in DenyUsers, AllowUsers, DenyGroups or AllowGroups keeps svc_ansible out.' }}
          vars:
            bootstrap_groups: "{{ bootstrap_account_groups.stdout.split() }}"
            bootstrap_deny_users: >-
              {{ bootstrap_sshd_policy.stdout_lines | select('match', '^denyusers ')
                 | map('regex_replace', '^denyusers ', '') | list }}
            bootstrap_allow_users: >-
              {{ bootstrap_sshd_policy.stdout_lines | select('match', '^allowusers ')
                 | map('regex_replace', '^allowusers ', '') | list }}
            bootstrap_deny_groups: >-
              {{ bootstrap_sshd_policy.stdout_lines | select('match', '^denygroups ')
                 | map('regex_replace', '^denygroups ', '') | list }}
            bootstrap_allow_groups: >-
              {{ bootstrap_sshd_policy.stdout_lines | select('match', '^allowgroups ')
                 | map('regex_replace', '^allowgroups ', '') | list }}
            bootstrap_unsure_user: '^svc_ansible@[^@]*$|^[^@]*[*?][^@]*(@[^@]*)?$|@.*@'
            bootstrap_unsure_group: '[*? ]'
            bootstrap_access_refused: >-
              {{ (['DenyUsers lists svc_ansible'] if 'svc_ansible' in bootstrap_deny_users else [])
                 + (['AllowUsers does not list svc_ansible'] if bootstrap_allow_users
                    and 'svc_ansible' not in bootstrap_allow_users
                    and not bootstrap_allow_users | select('search', bootstrap_unsure_user) | list else [])
                 + (["DenyGroups lists svc_ansible's group " ~ bootstrap_deny_groups | select('in', bootstrap_groups) | first]
                    if bootstrap_deny_groups | select('in', bootstrap_groups) | list else [])
                 + (["AllowGroups lists none of svc_ansible's groups (" ~ bootstrap_groups | join(' ') ~ ")"]
                    if bootstrap_allow_groups and not bootstrap_allow_groups | select('in', bootstrap_groups) | list
                    and not bootstrap_allow_groups | select('search', bootstrap_unsure_group) | list else []) }}
            bootstrap_access_unsure: >-
              {{ bootstrap_deny_users | select('search', bootstrap_unsure_user) | map('regex_replace', '^', 'DenyUsers ') | list
                 + ((bootstrap_allow_users | select('search', bootstrap_unsure_user) | map('regex_replace', '^', 'AllowUsers ') | list)
                    if 'svc_ansible' not in bootstrap_allow_users else [])
                 + bootstrap_deny_groups | select('search', bootstrap_unsure_group) | map('regex_replace', '^', 'DenyGroups ') | list
                 + ((bootstrap_allow_groups | select('search', bootstrap_unsure_group) | map('regex_replace', '^', 'AllowGroups ') | list)
                    if not bootstrap_allow_groups | select('in', bootstrap_groups) | list else []) }}

        - name: Schedule the SSH reload only after every check has passed
          ansible.builtin.debug:
            msg: The checked SSH policy will be applied.
          changed_when: bootstrap_dropin is changed
          notify: Reload the SSH service
      rescue:
        - name: Put back the drop-in this run replaced
          ansible.builtin.copy:
            src: "{{ bootstrap_dropin.backup_file }}"
            dest: "{{ ssh_dropin }}"
            remote_src: true
            owner: root
            group: root
            mode: "0644"
          when: bootstrap_dropin.backup_file is defined

        - name: Remove the drop-in this run created
          ansible.builtin.file:
            path: "{{ ssh_dropin }}"
            state: absent
          when: not bootstrap_dropin_before.stat.exists

        - name: Stop without reloading SSH
          ansible.builtin.fail:
            msg: The SSH check failed. The previous drop-in state was restored and SSH was not reloaded.

    - name: Apply the checked SSH policy now
      ansible.builtin.meta: flush_handlers

    - name: Read svc_ansible's sudo rights
      ansible.builtin.command: sudo -l -U svc_ansible
      register: bootstrap_sudo_rights
      changed_when: false

    - name: Try sudo as svc_ansible without a password
      ansible.builtin.command: sudo -k -n /usr/bin/true
      become: true
      become_user: svc_ansible
      vars:
        ansible_pipelining: true
      register: bootstrap_sudo_nopass
      changed_when: false
      failed_when: false

    - name: Check that sudo requires the password
      ansible.builtin.assert:
        that:
          - "'(ALL : ALL) ALL' in bootstrap_sudo_rights.stdout"
          - "'NOPASSWD' not in bootstrap_sudo_rights.stdout"
          - "'!authenticate' not in bootstrap_sudo_rights.stdout"
          - bootstrap_sudo_rights.stdout is not search('(^|[\\s,])(rootpw|targetpw|runaspw)([\\s,]|$)', multiline=True)
          - bootstrap_sudo_nopass.rc != 0
        fail_msg: >-
          svc_ansible can use sudo without its password (a NOPASSWD or !authenticate rule), or sudo
          asks for another account's password (rootpw, targetpw or runaspw). Review
          "sudo -l -U svc_ansible" on the host.
        success_msg: svc_ansible is ready; continue with chapter 4, step 5.

    - name: Read the RSA host key's fingerprint for the controller
      ansible.builtin.command: ssh-keygen -lf /etc/ssh/ssh_host_rsa_key.pub
      register: bootstrap_rsa_host_key
      changed_when: false
      failed_when: false

    # Built here on the controller, from its inventory and a fingerprint checked here:
    # only values that pass add-target.sh's own checks, or a placeholder to replace,
    # so it is a single command you can check before running it.
    - name: Show the controller command that adds this host
      ansible.builtin.debug:
        msg:
          - >-
            Add this VM on the controller: in the guide's folder, run this command (replace NAME, ADDRESS
            or FINGERPRINT if shown, and add --lab-dir DIR for a lab folder other than /opt/ansible-lab):
          - "{{ bootstrap_add_line }}"
      vars:
        bootstrap_add_name: "{{ inventory_hostname }}"
        bootstrap_add_address: "{{ ansible_host | default(inventory_hostname) }}"
        bootstrap_add_group: "{{ 'ubuntu' if ansible_facts['os_family'] == 'Debian' else 'enterprise_linux' }}"
        bootstrap_add_fingerprint: "{{ (bootstrap_rsa_host_key.stdout.split() + ['', ''])[1] }}"
        bootstrap_add_line: >-
          {{ 'sudo bash scripts/add-target.sh'
             ~ ' --name ' ~ (bootstrap_add_name
                             if bootstrap_add_name is regex('[A-Za-z0-9][A-Za-z0-9._-]*', match_type='fullmatch') else 'NAME')
             ~ ' --address ' ~ (bootstrap_add_address
                                if bootstrap_add_address is regex('[A-Za-z0-9:][A-Za-z0-9.:-]*', match_type='fullmatch') else 'ADDRESS')
             ~ ' --group ' ~ bootstrap_add_group
             ~ ' --fingerprint ' ~ (bootstrap_add_fingerprint
                                    if bootstrap_add_fingerprint is regex('SHA256:[A-Za-z0-9+/]+', match_type='fullmatch') else 'FINGERPRINT') }}

  handlers:
    - name: Reload the SSH service
      ansible.builtin.service:
        name: "{{ ssh_service }}"
        state: reloaded
