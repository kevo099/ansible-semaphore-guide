---
# One-shot preparation of a VM that already exists (made in a cloud portal, by
# another tool, or before cloud-init was set up): the automated form of chapter
# 4, steps 3 and 4. It creates or completes svc_ansible, authorizes the listed
# public keys, ensures the target prerequisites, sets the sudo password you type,
# and adds the dedicated sudoers and SSH drop-ins. It is safe to run again.
#
# The VM must already accept SSH from the controller for an administrator whose
# sudo works, and have Python 3; mainstream cloud images do.
#
# Run it from the controller's repository root, as the VM's own administrator
# account, one host at a time (each target gets its own sudo password):
#
#   /opt/ansible-venv/bin/ansible-playbook -i inventories/bootstrap.ini \
#     examples/bootstrap-existing-vm.yml --limit new-vm -u YOUR_ADMIN [-K]
#
# -K is needed only when that administrator's own sudo asks for a password.
- name: Prepare an existing VM for the automation account
  hosts: all
  gather_facts: true
  become: true
  vars_prompt:
    - name: svc_ansible_password
      prompt: New sudo password for svc_ansible on this host (unique per target)
      private: true
      confirm: true
  vars:
    # Every public key that may log in as svc_ansible. On a controller made by either
    # installer, list the exported service key and, if you use one, your CLI key.
    automation_public_key_files:
      - ~/.ssh/ansible_lab.pub
    automation_public_keys: "{{ query('ansible.builtin.file', *automation_public_key_files) }}"
    ssh_service: "{{ 'ssh' if ansible_facts['os_family'] == 'Debian' else 'sshd' }}"
    ssh_dropin: /etc/ssh/sshd_config.d/70-ansible-lab.conf
    # SSH_CONNECTION holds the client address and port, then this host's address and port,
    # so the policy is read for exactly the connection the controller uses.
    bootstrap_sshd_context: >-
      {% set c = bootstrap_ssh_connection.stdout.split() %}user=svc_ansible,host={{ c[0] }},addr={{ c[0] }},laddr={{ c[2] }},lport={{ c[3] }}
  pre_tasks:
    - name: Require a limit that selects exactly one host
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_play_hosts_all | length == 1
        fail_msg: Name one host with --limit; each target gets its own sudo password.
        quiet: true

    - name: Accept only the systems the lessons support
      ansible.builtin.assert:
        that:
          - >-
            (ansible_facts['distribution'] == 'Ubuntu' and ansible_facts['distribution_major_version'] == '24')
            or (ansible_facts['distribution'] in ['AlmaLinux', 'Rocky', 'RedHat']
                and ansible_facts['distribution_major_version'] == '9')
        fail_msg: This playbook prepares Ubuntu 24.04 or AlmaLinux, Rocky Linux or RHEL 9 only.
        quiet: true

    - name: Accept only public keys and a password of reasonable length
      ansible.builtin.assert:
        that:
          - automation_public_keys | length > 0
          - automation_public_keys | reject('match', '^(ssh-rsa|ssh-ed25519|ecdsa-sha2-nistp[0-9]+) [A-Za-z0-9+/=]+( .*)?$') | list | length == 0
          - svc_ansible_password | length >= 12
        fail_msg: List only single-line public key files, and use a sudo password of at least 12 characters.
        quiet: true
      no_log: true

    - name: Find the address this host sees for the controller
      ansible.builtin.command: printenv SSH_CONNECTION
      become: false
      register: bootstrap_ssh_connection
      changed_when: false

    - name: Read which keys this SSH server accepts for svc_ansible
      ansible.builtin.command: /usr/sbin/sshd -T -C {{ bootstrap_sshd_context }}
      register: bootstrap_sshd_before
      changed_when: false

    - name: Measure each listed key on the controller
      ansible.builtin.command: ssh-keygen -lf -
      args:
        stdin: "{{ item }}"
      loop: "{{ automation_public_keys }}"
      loop_control:
        label: "{{ item.split()[0] }}"
      register: bootstrap_key_sizes
      changed_when: false
      delegate_to: localhost
      become: false

    # A FIPS or STIG crypto policy refuses Ed25519 keys, and servers set a minimum RSA
    # size; replacing the list with keys the server rejects would lock svc_ansible out.
    - name: Require at least one listed key that can log in
      ansible.builtin.assert:
        that:
          - bootstrap_usable_other | length + (bootstrap_usable_rsa | length if bootstrap_rsa_accepted else 0) > 0
        fail_msg: >-
          None of the listed keys can log in: this server accepts
          {{ bootstrap_accepted | join(', ') }}, and RSA keys of at least
          {{ bootstrap_min_rsa }} bits. Use an RSA 4096 key.
        quiet: true
      vars:
        bootstrap_policy_before: "{{ bootstrap_sshd_before.stdout_lines }}"
        bootstrap_accepted: >-
          {{ (bootstrap_policy_before | select('match', '^pubkeyacceptedalgorithms ')
              | first | default('pubkeyacceptedalgorithms none')).split()[1].split(',') }}
        # OpenSSH 9.1 and later report RequiredRSASize; the guide never accepts less than 2048 bits.
        bootstrap_min_rsa: >-
          {{ ([2048] + (bootstrap_policy_before | select('match', '^requiredrsasize ')
              | map('split') | map('last') | map('int') | list)) | max }}
        bootstrap_rsa_accepted: "{{ ['rsa-sha2-512', 'rsa-sha2-256', 'ssh-rsa'] | intersect(bootstrap_accepted) | length > 0 }}"
        bootstrap_usable_rsa: >-
          {{ bootstrap_key_sizes.results | selectattr('item', 'match', '^ssh-rsa ')
             | map(attribute='stdout') | map('split') | map('first') | map('int')
             | select('ge', bootstrap_min_rsa | int) | list }}
        bootstrap_usable_other: >-
          {{ automation_public_keys | map('split') | map('first') | reject('eq', 'ssh-rsa')
             | select('in', bootstrap_accepted) | list }}

  tasks:
    - name: Ensure the Ubuntu prerequisites
      ansible.builtin.apt:
        name: [python3, python3-apt, sudo, openssh-server]
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts['os_family'] == 'Debian'

    - name: Ensure the Enterprise Linux prerequisites
      ansible.builtin.dnf:
        name: [python3, python3-dnf, python3-libselinux, sudo, openssh-server]
        state: present
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Create or complete the automation account
      ansible.builtin.user:
        name: svc_ansible
        shell: /bin/bash
        create_home: true
        # A per-host salt keeps the hash stable, so a repeat run reports no change.
        password: "{{ svc_ansible_password | password_hash('sha512', inventory_hostname | hash('sha256') | truncate(16, True, '')) }}"
        update_password: always
      no_log: true

    - name: Create the account's SSH directory
      ansible.builtin.file:
        path: /home/svc_ansible/.ssh
        state: directory
        owner: svc_ansible
        group: svc_ansible
        mode: "0700"

    - name: Authorize exactly the listed public keys
      ansible.builtin.copy:
        content: "{{ automation_public_keys | join('\n') }}\n"
        dest: /home/svc_ansible/.ssh/authorized_keys
        owner: svc_ansible
        group: svc_ansible
        mode: "0600"

    - name: Restore SELinux labels on the SSH directory
      ansible.builtin.command: restorecon -RFv /home/svc_ansible/.ssh
      register: bootstrap_restorecon
      changed_when: bootstrap_restorecon.stdout | length > 0
      when: ansible_facts['selinux']['status'] | default('disabled') == 'enabled'

    - name: Allow svc_ansible to use sudo with its password
      ansible.builtin.copy:
        content: |
          Defaults:svc_ansible !requiretty
          svc_ansible ALL=(ALL:ALL) ALL
        dest: /etc/sudoers.d/90-ansible-lab
        owner: root
        group: root
        mode: "0440"
        validate: visudo -cf %s

    - name: Record whether the SSH drop-in already exists
      ansible.builtin.stat:
        path: "{{ ssh_dropin }}"
      register: bootstrap_dropin_before

    - name: Require a key for svc_ansible over SSH, checked before any reload
      block:
        - name: Write the account's SSH drop-in
          ansible.builtin.copy:
            content: |
              Match User svc_ansible
                  AuthenticationMethods publickey
                  PasswordAuthentication no
                  KbdInteractiveAuthentication no
              Match all
            dest: "{{ ssh_dropin }}"
            owner: root
            group: root
            mode: "0644"
            backup: true
          register: bootstrap_dropin

        - name: Check the complete SSH configuration
          ansible.builtin.command: /usr/sbin/sshd -t
          changed_when: false

        - name: Read the effective SSH policy for svc_ansible from this controller
          ansible.builtin.command: /usr/sbin/sshd -T -C {{ bootstrap_sshd_context }}
          register: bootstrap_sshd_policy
          changed_when: false

        - name: Check that the policy is the one chapter 4 expects
          ansible.builtin.assert:
            that:
              - "'authenticationmethods publickey' in bootstrap_sshd_policy.stdout_lines"
              - "'passwordauthentication no' in bootstrap_sshd_policy.stdout_lines"
              - "'kbdinteractiveauthentication no' in bootstrap_sshd_policy.stdout_lines"
              - "'pubkeyauthentication yes' in bootstrap_sshd_policy.stdout_lines"
              - "'/home/svc_ansible/.ssh/authorized_keys' in bootstrap_key_paths"
            fail_msg: Another SSH setting overrides the svc_ansible policy; resolve it before reloading SSH.
            quiet: true
          vars:
            # AuthorizedKeysFile entries with their tokens resolved; relative ones are in the home.
            bootstrap_key_paths: >-
              {{ (bootstrap_sshd_policy.stdout_lines | select('match', '^authorizedkeysfile ')
                  | first | default('authorizedkeysfile none')).split()[1:]
                 | map('replace', '%h', '/home/svc_ansible') | map('replace', '%u', 'svc_ansible')
                 | map('regex_replace', '^([^/])', '/home/svc_ansible/\\1') | list }}

        - name: Schedule the SSH reload only after every check has passed
          ansible.builtin.debug:
            msg: The checked SSH policy will be applied.
          changed_when: bootstrap_dropin is changed
          notify: Reload the SSH service
      rescue:
        - name: Put back the drop-in this run replaced
          ansible.builtin.copy:
            src: "{{ bootstrap_dropin.backup_file }}"
            dest: "{{ ssh_dropin }}"
            remote_src: true
            owner: root
            group: root
            mode: "0644"
          when: bootstrap_dropin.backup_file is defined

        - name: Remove the drop-in this run created
          ansible.builtin.file:
            path: "{{ ssh_dropin }}"
            state: absent
          when: not bootstrap_dropin_before.stat.exists

        - name: Stop without reloading SSH
          ansible.builtin.fail:
            msg: The SSH check failed. The previous drop-in state was restored and SSH was not reloaded.

    - name: Apply the checked SSH policy now
      ansible.builtin.meta: flush_handlers

    - name: Read svc_ansible's sudo rights
      ansible.builtin.command: sudo -l -U svc_ansible
      register: bootstrap_sudo_rights
      changed_when: false

    - name: Try sudo as svc_ansible without a password
      ansible.builtin.command: sudo -k -n /usr/bin/true
      become: true
      become_user: svc_ansible
      vars:
        ansible_pipelining: true
      register: bootstrap_sudo_nopass
      changed_when: false
      failed_when: false

    - name: Check that sudo requires the password
      ansible.builtin.assert:
        that:
          - "'(ALL : ALL) ALL' in bootstrap_sudo_rights.stdout"
          - "'NOPASSWD' not in bootstrap_sudo_rights.stdout"
          - "'!authenticate' not in bootstrap_sudo_rights.stdout"
          - bootstrap_sudo_rights.stdout is not search('(^|[\\s,])(rootpw|targetpw|runaspw)([\\s,]|$)', multiline=True)
          - bootstrap_sudo_nopass.rc != 0
        fail_msg: >-
          svc_ansible can use sudo without its password (a NOPASSWD or !authenticate rule), or sudo
          asks for another account's password (rootpw, targetpw or runaspw). Review
          "sudo -l -U svc_ansible" on the host.
        success_msg: svc_ansible is ready; continue with chapter 4, step 5.

  handlers:
    - name: Reload the SSH service
      ansible.builtin.service:
        name: "{{ ssh_service }}"
        state: reloaded
