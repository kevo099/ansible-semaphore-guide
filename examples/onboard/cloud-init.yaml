#cloud-config
# Prepare a new Linux VM for the guide's automation account at first boot:
# svc_ansible with the controller's public key and no password, the sudoers
# rule and SSH drop-in from chapter 4, and the Python bindings the lessons need.
# One file for Ubuntu 24.04 and AlmaLinux, Rocky Linux or RHEL 9.
#
# Replace REPLACE_WITH_AUTOMATION_PUBLIC_KEY with the one line of the
# controller's ~/.ssh/ansible_lab.pub, keeping the double quotes. If the key's
# comment (after the base64 part) contains a " or a \, leave the comment out.
# Paste the result into the portal's Custom data field (Advanced tab), or pass
# it with az vm create --custom-data. cloud-init reads it at first boot only; for a VM
# that already exists, use onboard-linux.sh instead.
#
# The sudo password is set afterwards, never here: Azure advises against
# secrets in custom data. Chapter 13 lists the ways. Do not name the VM's
# administrator svc_ansible: cloud-init gives that account passwordless sudo.
users:
  - default
  - name: svc_ansible
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - "REPLACE_WITH_AUTOMATION_PUBLIC_KEY"

write_files:
  - path: /etc/sudoers.d/90-ansible-lab
    owner: root:root
    permissions: "0440"
    content: |
      Defaults:svc_ansible !requiretty
      svc_ansible ALL=(ALL:ALL) ALL
  - path: /etc/ssh/sshd_config.d/70-ansible-lab.conf
    owner: root:root
    permissions: "0644"
    content: |
      Match User svc_ansible
          AuthenticationMethods publickey
          PasswordAuthentication no
          KbdInteractiveAuthentication no
      Match all

# Package names differ by family, so install them here rather than in packages:.
# Every check reports to the console log (/var/log/cloud-init-output.log), and
# any failure makes cloud-init report an error.
runcmd:
  - - /bin/bash
    - -c
    - |
      set -u
      failed=
      problem() { echo "onboard: ERROR: $*" >&2; failed=yes; }
      keys=/home/svc_ansible/.ssh/authorized_keys
      # cloud-init drops a key it cannot parse, such as the unreplaced placeholder.
      if ! [ -s "$keys" ] || ! ssh-keygen -lf "$keys" >/dev/null 2>&1; then
        problem "svc_ansible has no valid public key; was the placeholder replaced?"
      fi
      if command -v apt-get >/dev/null; then
        export DEBIAN_FRONTEND=noninteractive
        apt-get -o DPkg::Lock::Timeout=600 install -y -q python3 python3-apt ||
          { apt-get -o DPkg::Lock::Timeout=600 update -q &&
            apt-get -o DPkg::Lock::Timeout=600 install -y -q python3 python3-apt; } ||
          problem "python3-apt installation failed"
        # ssh.service starts on the first connection; sshd -t needs its runtime directory.
        install -d -m 0755 /run/sshd
        ssh_unit=ssh
      else
        dnf -y -q install python3 python3-dnf python3-libselinux ||
          problem "python3-dnf installation failed"
        ssh_unit=sshd
      fi
      if ! visudo -cq; then
        rm -f /etc/sudoers.d/90-ansible-lab
        problem "the sudo configuration did not parse; the rule was removed"
      elif ! rights=$(sudo -l -U svc_ansible) || ! grep -q '(ALL : ALL) ALL' <<<"$rights"; then
        problem "sudo does not grant svc_ansible its (ALL : ALL) ALL rule"
      elif grep -Eq 'NOPASSWD|!authenticate' <<<"$rights"; then
        problem "svc_ansible can sudo without its password; is it also the VM's administrator name?"
      elif grep -Eq '(^|[[:space:],])(rootpw|targetpw|runaspw)([[:space:],]|$)' <<<"$rights"; then
        problem "sudo asks for another account's password (rootpw, targetpw or runaspw)"
      fi
      if command -v selinuxenabled >/dev/null && selinuxenabled; then
        restorecon -RF /home/svc_ansible/.ssh || problem "restorecon failed"
      fi
      # The controller's address is not known here, so loopback is checked. Match
      # rules that depend on the client's address need onboard-linux.sh with
      # CONTROLLER_ADDRESS, or bootstrap-existing-vm.yml, to check the real one.
      sshd_files() {
        local depth=$1 file pattern
        shift
        [ "$depth" -le 16 ] || return 0
        for file in "$@"; do
          [ -f "$file" ] || continue
          printf '%s\n' "$file"
          while read -r pattern; do
            [[ $pattern == /* ]] || pattern=/etc/ssh/$pattern
            # shellcheck disable=SC2086  # the Include pattern is a glob to expand
            sshd_files $((depth + 1)) $pattern
          done < <(awk 'tolower($1) == "include" {for (i = 2; i <= NF; i++) print $i}' "$file")
        done
      }
      mapfile -t config_files < <(sshd_files 1 /etc/ssh/sshd_config | sort -u)
      if grep -qEi '^[[:space:]]*Match[[:space:]].*\b(Address|Host|LocalAddress|LocalPort|RDomain)\b' \
           "${config_files[@]}" 2>/dev/null; then
        problem "Match rules depend on the client's address; check with onboard-linux.sh and CONTROLLER_ADDRESS"
      fi
      # Take the drop-in back only when it is what makes the configuration invalid.
      dropin=/etc/ssh/sshd_config.d/70-ansible-lab.conf
      if ! /usr/sbin/sshd -t; then
        mv -f "$dropin" "$dropin.rejected" 2>/dev/null
        if /usr/sbin/sshd -t; then
          problem "the SSH drop-in made the configuration invalid; it was moved to $dropin.rejected"
        else
          mv -f "$dropin.rejected" "$dropin" 2>/dev/null
          problem "the SSH configuration is invalid for another reason; see sshd -t"
        fi
      fi
      home=$(getent passwd svc_ansible | cut -d: -f6)
      policy=$(/usr/sbin/sshd -T -C user=svc_ansible,host=localhost,addr=127.0.0.1) || policy=
      for line in 'authenticationmethods publickey' 'passwordauthentication no' \
                  'kbdinteractiveauthentication no' 'pubkeyauthentication yes'; do
        grep -qx "$line" <<<"$policy" || problem "another SSH setting overrides '$line' for svc_ansible"
      done
      # The effective AuthorizedKeysFile must include the file cloud-init wrote.
      key_file_read=
      read -r -a entries <<<"$(awk '$1 == "authorizedkeysfile" {$1 = ""; print}' <<<"$policy")"
      for entry in "${entries[@]}"; do
        path=${entry//%%/$'\001'}
        path=${path//%h/$home}
        path=${path//%u/svc_ansible}
        path=${path//%U/$(id -u svc_ansible)}
        path=${path//$'\001'/%}
        [[ $path == /* ]] || path=$home/$path
        [ "$path" = "$home/.ssh/authorized_keys" ] && key_file_read=yes
      done
      [ -n "$key_file_read" ] || problem "AuthorizedKeysFile does not include $home/.ssh/authorized_keys"
      # At least one authorized key must be of a type, and RSA size, this server accepts.
      accepted=$(awk '$1 == "pubkeyacceptedalgorithms" {print $2}' <<<"$policy")
      min_rsa=$(awk '$1 == "requiredrsasize" {print $2}' <<<"$policy")
      [ "${min_rsa:-0}" -ge 2048 ] || min_rsa=2048
      usable=
      while read -r type rest; do
        case "$type" in ssh-rsa) algorithms='rsa-sha2-512 rsa-sha2-256' ;; *) algorithms=$type ;; esac
        if [ "$type" = ssh-rsa ]; then
          bits=$(printf '%s %s\n' "$type" "$rest" | ssh-keygen -lf - 2>/dev/null | awk '{print $1}')
          [ "${bits:-0}" -ge "$min_rsa" ] || continue
        fi
        for algorithm in $algorithms; do
          [[ ,$accepted, == *,"$algorithm",* ]] && usable=yes
        done
      done < <(grep -v '^[[:space:]]*#' "$keys" 2>/dev/null)
      [ -n "$usable" ] || problem "no authorized key is of a type and size this SSH server accepts; use an RSA 4096 key"
      # Reload a running server; on Ubuntu an active ssh.socket is enough. Otherwise start it.
      if systemctl is-active --quiet "$ssh_unit"; then
        systemctl reload "$ssh_unit" || problem "SSH did not reload"
      elif ! { [ "$ssh_unit" = ssh ] && systemctl is-active --quiet ssh.socket; }; then
        if ! { systemctl start "$ssh_unit" && systemctl is-active --quiet "$ssh_unit"; }; then
          problem "no SSH service or socket is running"
        fi
      fi
      if [ -n "$failed" ]; then
        echo "onboard: FAILED; see the errors above" >&2
        exit 1
      fi
      echo "onboard: svc_ansible is ready; set its sudo password next"
