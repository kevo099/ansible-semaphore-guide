---
# Target VMs with private addresses only. At first boot, ../onboard/cloud-init.yaml
# creates svc_ansible with the controller's automation public key, its sudoers
# rule and SSH drop-in; its sudo password is set afterwards (chapter 13).
- name: Create Azure target VMs
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars.yml
  vars:
    # Use the virtual environment that holds the Azure SDK, not the system Python.
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    azure_required_vars: [azure_subscription_id, azure_tags, azure_targets]
    automation_public_key: "{{ lookup('ansible.builtin.file', azure_automation_public_key_file) }}"
    # The same file you would paste into the portal, with its quoted placeholder
    # replaced by the key as a JSON string, which is valid YAML whatever the key's comment holds.
    cloud_init_template: "{{ lookup('ansible.builtin.file', '../onboard/cloud-init.yaml') }}"
    cloud_init_data: >-
      {{ cloud_init_template | replace('"REPLACE_WITH_AUTOMATION_PUBLIC_KEY"', automation_public_key | to_json) }}
  module_defaults:
    group/azure.azcollection.all:
      subscription_id: "{{ azure_subscription_id }}"
      auth_source: cli
  tasks:
    - name: Check the variables
      ansible.builtin.import_tasks: tasks-preflight.yml

    - name: Accept only a single-line public key
      ansible.builtin.assert:
        that:
          - automation_public_key is match('^(ssh-rsa|ssh-ed25519|ecdsa-sha2-nistp[0-9]+) [A-Za-z0-9+/=]+( .*)?$')
          - "'PRIVATE KEY' not in automation_public_key"
        fail_msg: azure_automation_public_key_file must be the automation key's .pub file.
        quiet: true

    - name: Keep svc_ansible for automation only
      ansible.builtin.assert:
        that:
          - azure_admin_user != 'svc_ansible'
        fail_msg: >-
          Choose another azure_admin_user. cloud-init gives the administrator
          passwordless sudo, which would bypass svc_ansible's password.
        quiet: true

    - name: Check that the key replaced the cloud-init placeholder
      ansible.builtin.assert:
        that:
          - cloud_init_template.count('"REPLACE_WITH_AUTOMATION_PUBLIC_KEY"') == 1
          - "'\"REPLACE_WITH_AUTOMATION_PUBLIC_KEY\"' not in cloud_init_data"
          - (cloud_init_data | from_yaml)['users'][1]['ssh_authorized_keys'] == [automation_public_key]
        fail_msg: ../onboard/cloud-init.yaml must contain the quoted key placeholder exactly once.
        quiet: true

    - name: Target network interfaces (no public address)
      azure.azcollection.azure_rm_networkinterface:
        resource_group: "{{ azure_resource_group }}"
        name: "nic-{{ item.name }}"
        virtual_network: "{{ azure_vnet_name }}"
        subnet_name: "{{ azure_subnet_name }}"
        security_group: nsg-lab-targets
        ip_configurations:
          - name: ipconfig1
            primary: true
            private_ip_allocation_method: Static
            private_ip_address: "{{ item.private_ip }}"
        tags: "{{ azure_tags }}"
      loop: "{{ azure_targets }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Target VMs with the onboarding cloud-init
      azure.azcollection.azure_rm_virtualmachine:
        resource_group: "{{ azure_resource_group }}"
        name: "{{ item.name }}"
        vm_size: "{{ azure_vm_size }}"
        admin_username: "{{ azure_admin_user }}"
        ssh_password_enabled: false
        ssh_public_keys:
          - path: "/home/{{ azure_admin_user }}/.ssh/authorized_keys"
            key_data: "{{ lookup('ansible.builtin.file', azure_admin_public_key_file) }}"
        network_interface_names:
          - "nic-{{ item.name }}"
        image: "{{ item.image }}"
        managed_disk_type: StandardSSD_LRS
        os_disk_size_gb: 40
        os_disk_delete_option: Delete
        custom_data: "{{ cloud_init_data }}"
        tags: "{{ azure_tags }}"
      loop: "{{ azure_targets }}"
      loop_control:
        label: "{{ item.name }}"
