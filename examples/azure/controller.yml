---
# Optional: a controller VM in Azure. It is the only VM with a public address,
# and its SSH is open to your own address prefix alone. Run network.yml first.
- name: Create an Azure controller VM
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars.yml
  vars:
    # Use the virtual environment that holds the Azure SDK, not the system Python.
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    azure_required_vars: [azure_subscription_id, azure_tags, azure_controller]
    azure_required_key_files: [azure_admin_public_key_file]
    # nsg-lab-controller holds exactly these rules: purge_rules removes any other,
    # including one added by hand. Open HTTPS with azure_controller.https_cidr.
    controller_rules:
      - name: ssh-from-operator
        protocol: Tcp
        source_address_prefix: "{{ azure_controller.operator_cidr }}"
        destination_port_range: 22
        access: Allow
        priority: 100
        direction: Inbound
      # Azure's default AllowVNetInBound would otherwise open every port to the VNet.
      - name: deny-other-inbound
        protocol: "*"
        source_address_prefix: "*"
        destination_port_range: "*"
        access: Deny
        priority: 4000
        direction: Inbound
    # Semaphore behind expose-semaphore.sh --mode https; added only when https_cidr is set.
    controller_https_rules:
      - name: https-from-operator
        protocol: Tcp
        source_address_prefix: "{{ azure_controller.https_cidr | default('') }}"
        destination_port_range: 443
        access: Allow
        priority: 110
        direction: Inbound
  module_defaults:
    group/azure.azcollection.all:
      subscription_id: "{{ azure_subscription_id }}"
      auth_source: cli
  tasks:
    - name: Check the variables
      ansible.builtin.import_tasks: tasks-preflight.yml

    - name: Keep HTTPS to one address prefix of your own
      ansible.builtin.assert:
        that:
          - https_cidr is string
          - https_cidr | lower not in ['*', 'any', 'internet']
          - https_cidr is not search('/0$')
        fail_msg: >-
          azure_controller.https_cidr must be one address prefix of your own, as operator_cidr
          is for SSH, never one that opens Semaphore's login page to everyone.
        quiet: true
      vars:
        https_cidr: "{{ azure_controller.https_cidr | default('', true) }}"

    - name: Network security group for the controller (SSH, and HTTPS if set, from your own prefixes only)
      azure.azcollection.azure_rm_securitygroup:
        resource_group: "{{ azure_resource_group }}"
        name: nsg-lab-controller
        purge_rules: true
        rules: >-
          {{ controller_rules
             + (controller_https_rules if azure_controller.https_cidr | default('', true) | length > 0 else []) }}
        tags: "{{ azure_tags }}"

    - name: Static public address for the controller
      azure.azcollection.azure_rm_publicipaddress:
        resource_group: "{{ azure_resource_group }}"
        name: "pip-{{ azure_controller.name }}"
        sku: standard
        allocation_method: static
        tags: "{{ azure_tags }}"
      register: azure_controller_pip

    - name: Controller network interface
      azure.azcollection.azure_rm_networkinterface:
        resource_group: "{{ azure_resource_group }}"
        name: "nic-{{ azure_controller.name }}"
        virtual_network: "{{ azure_vnet_name }}"
        subnet_name: "{{ azure_subnet_name }}"
        security_group: nsg-lab-controller
        ip_configurations:
          - name: ipconfig1
            primary: true
            private_ip_allocation_method: Static
            private_ip_address: "{{ azure_controller.private_ip }}"
            public_ip_address_name: "pip-{{ azure_controller.name }}"
        tags: "{{ azure_tags }}"

    - name: Check a controller VM that already exists
      ansible.builtin.import_tasks: tasks-existing-vms.yml
      vars:
        azure_planned_vms: "{{ [azure_controller] }}"

    - name: Controller VM (bootstrap administrator key only)
      azure.azcollection.azure_rm_virtualmachine:
        resource_group: "{{ azure_resource_group }}"
        name: "{{ azure_controller.name }}"
        vm_size: "{{ azure_vm_size }}"
        admin_username: "{{ azure_admin_user }}"
        ssh_password_enabled: false
        ssh_public_keys:
          - path: "/home/{{ azure_admin_user }}/.ssh/authorized_keys"
            key_data: "{{ lookup('ansible.builtin.file', azure_admin_public_key_file) }}"
        network_interface_names:
          - "nic-{{ azure_controller.name }}"
        image: "{{ azure_controller.image }}"
        plan: "{{ azure_controller.plan | default(omit) }}"
        managed_disk_type: StandardSSD_LRS
        # Azure refuses an OS disk smaller than its image, and Red Hat's RHEL 9
        # images are 64 GB. azure_controller.os_disk_size_gb chooses another size.
        os_disk_size_gb: >-
          {{ azure_controller.os_disk_size_gb
             | default(64 if azure_controller.image.publisher | default('') | lower == 'redhat' else 32) }}
        os_disk_delete_option: Delete
        tags: "{{ azure_tags }}"

    - name: Report the controller's public address
      ansible.builtin.debug:
        msg: "Controller {{ azure_controller.name }} public address: {{ azure_controller_pip.state.ip_address }}"
