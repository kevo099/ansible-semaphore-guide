---
name: Validate public examples
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate documentation and source boundaries
        run: python scripts/validate.py
      - name: Test secret generation and assessment interpretation
        run: python -m unittest discover -s tests -v
      - name: Check all lesson playbooks
        run: |
          for playbook in playbooks/*.yml; do
            ansible-playbook -i inventories/lab.ini.example --syntax-check "$playbook"
          done
          ansible-lint --offline playbooks/
      - name: Confirm the installer defaults to a plan
        run: bash scripts/install-controller.sh --plan
